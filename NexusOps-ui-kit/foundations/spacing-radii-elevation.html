<!-- @dsCard group="Spacing" viewport="700x230" name="Radii & elevation" subtitle="Tight mechanical corners + achromatic depth" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin:0; background:var(--surface-canvas); color:var(--text-primary); font-family:var(--font-sans); padding:22px 24px; }
  h4 { margin:0 0 12px; font-size:var(--eyebrow-size); letter-spacing:var(--eyebrow-tracking); text-transform:uppercase; color:var(--text-faint); font-weight:var(--fw-semibold); }
  .grp { display:flex; gap:14px; margin-bottom:20px; }
  .item { display:flex; flex-direction:column; align-items:center; gap:7px; }
  .r { width:62px; height:42px; background:var(--surface-card); border:1px solid var(--border-default); }
  .e { width:80px; height:48px; background:var(--surface-card); border:1px solid var(--border-subtle); border-radius:var(--r-3); }
  .nm { font-family:var(--font-mono); font-size:10px; color:var(--text-muted); }
</style>
</head>
<body>
  <h4>radii</h4>
  <div class="grp">
    <div class="item"><div class="r" style="border-radius:var(--r-1)"></div><span class="nm">r-1 · 3</span></div>
    <div class="item"><div class="r" style="border-radius:var(--r-2)"></div><span class="nm">r-2 · 5</span></div>
    <div class="item"><div class="r" style="border-radius:var(--r-3)"></div><span class="nm">r-3 · 7</span></div>
    <div class="item"><div class="r" style="border-radius:var(--r-4)"></div><span class="nm">r-4 · 10</span></div>
    <div class="item"><div class="r" style="border-radius:var(--r-pill);width:42px"></div><span class="nm">pill</span></div>
  </div>
  <h4>elevation</h4>
  <div class="grp">
    <div class="item"><div class="e" style="box-shadow:var(--elev-1)"></div><span class="nm">elev-1</span></div>
    <div class="item"><div class="e" style="box-shadow:var(--elev-2)"></div><span class="nm">elev-2</span></div>
    <div class="item"><div class="e" style="box-shadow:var(--elev-3)"></div><span class="nm">elev-3</span></div>
    <div class="item"><div class="e" style="box-shadow:var(--elev-4)"></div><span class="nm">elev-4</span></div>
    <div class="item"><div class="e" style="box-shadow:var(--elev-inset);background:var(--surface-sunken)"></div><span class="nm">inset well</span></div>
  </div>
</body>
</html>
