<!-- @dsCard group="Spacing" viewport="700x200" name="Spacing scale" subtitle="4px base grid — dense desktop rhythm" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin:0; background:var(--surface-canvas); color:var(--text-primary); font-family:var(--font-sans); padding:24px; }
  .row { display:flex; align-items:center; gap:14px; padding:5px 0; }
  .bar { height:14px; background:var(--accent-surface); border:1px solid var(--accent-line); border-radius:2px; }
  .nm { font-family:var(--font-mono); font-size:10px; color:var(--text-secondary); width:44px; }
  .px { font-family:var(--font-mono); font-size:10px; color:var(--text-faint); width:36px; }
</style>
</head>
<body>
  <div class="row"><span class="nm">sp-2</span><span class="px">4</span><span class="bar" style="width:4px"></span></div>
  <div class="row"><span class="nm">sp-3</span><span class="px">6</span><span class="bar" style="width:6px"></span></div>
  <div class="row"><span class="nm">sp-4</span><span class="px">8</span><span class="bar" style="width:8px"></span></div>
  <div class="row"><span class="nm">sp-6</span><span class="px">12</span><span class="bar" style="width:12px"></span></div>
  <div class="row"><span class="nm">sp-8</span><span class="px">16</span><span class="bar" style="width:16px"></span></div>
  <div class="row"><span class="nm">sp-12</span><span class="px">24</span><span class="bar" style="width:24px"></span></div>
  <div class="row"><span class="nm">sp-16</span><span class="px">32</span><span class="bar" style="width:32px"></span></div>
  <div class="row"><span class="nm">sp-24</span><span class="px">48</span><span class="bar" style="width:48px"></span></div>
  <div class="row"><span class="nm">sp-32</span><span class="px">64</span><span class="bar" style="width:64px"></span></div>
</body>
</html>
