# nexusopsd — the Rust daemon (trust core). The single audited mutator + sole
# DB writer (§4, §15 INV-SEC-1). 1.1 lands the event-store spine.
[package]
name = "nexusopsd"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
nexusops-shared = { path = "../shared" }
# rusqlite pinned 0.34 (bundled): satisfies rusqlite_migration 2 (^0.34) while
# staying on libsqlite3-sys 0.31 — 0.40's libsqlite3-sys 0.38 uses the unstable
# `cfg_select` and won't build on stable 1.93 (see OQ-DATA-SPIKE-3).
rusqlite = { version = "0.34", features = ["bundled"] }
rusqlite_migration = "2"
ulid = "1.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2"
# RFC3339 UTC timestamps for the prod SystemClock (DATA_MODEL §2.1). Dep beyond
# the brief's list (rusqlite/migration/ulid) — flag at Step-9; justified by
# pervasive event timestamping. "parsing" added in 1.3 for outbox backoff
# arithmetic (Clock::now_plus_secs parses now + adds a Duration).
time = { version = "0.3", features = ["formatting", "parsing"] }
# getpeereid(2) FFI for the UDS peer-auth gate (§15 / safety rule #7 / ADR-004 — macOS/BSD,
# NOT the Linux-only SO_PEERCRED). The unsafe call is isolated in ipc::peer::peer_uid (1.5 L1).
libc = "0.2"
# the architecture-mandated async runtime (stack table / §12) — the daemon's first full async
# surface (1.6b): the write-actor command channel + drainer/reaper interval loops + the UDS
# accept-loop + the subscribe broadcast fanout. `net` = UnixListener; `signal` = SIGTERM/SIGINT.
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "sync", "time", "net"] }
# SHA-256 for the §6.3 idempotency-key derivation (2.3 L1): a ONE-WAY hash of the RAW action
# inputs — a fingerprint, not the secret (lead-ruled §15 Option A 2026-06-11; the keychain_ref
# convention keeps real secrets out of `inputs`, so the persisted hash reveals nothing recoverable).
# RustCrypto, audited; `cargo audit` runs at /phase-exit. Dep beyond the brief's list — flag at Step-9.
sha2 = "0.10"
# git2 (libgit2 via git2-rs) — READ-ONLY repo introspection: project detection (P5.1, this slice) +
# the dual-git read backend (P5.2). Forbidden #6 — git2 is NEVER used for mutations; worktree/branch/
# commit/merge go through the git CLI as Gateway actions. Pinned 0.21 + `vendored-libgit2` (a known
# bundled libgit2, matching the OQ-INT-SPIKE-6 spike that proved git2 0.21 reads relative-worktree
# repos); default-features off (no ssh/https — local read-only introspection only). A normal dep, so
# it is also visible to the integration tests that build hermetic fixture repos (tests/detect.rs).
git2 = { version = "0.21", default-features = false, features = ["vendored-libgit2"] }
# octocrab (P7.1) — GitHub typed REST client (§9). READ-ONLY here: the GitHub PR read client fetches
# a PR + its reviews + check-runs over an INJECTED Octocrab handle (auth bootstrap deferred — this
# client never builds the handle/reads the keychain), plumbing octocrab's string fields into edges-008's
# decoders. octocrab's models derive Deserialize so recorded public-JSON fixtures drive the extraction
# test-first; the live HTTP round-trip is the fake-covered non-deterministic edge. `cargo audit` runs
# at the P7.1 /phase-exit. async-trait makes the GithubReadClient trait dyn-compatible (the codebase's
# trait-object idiom: Arc<dyn ActionExecutor>/dyn Policy) so the gated github executor can inject it.
octocrab = "0.53"
async-trait = "0.1"
# reqwest (P7.1 edges-015) — the Linear GraphQL network adapter's HTTP shell (§9; Linear has no
# octocrab-equivalent Rust client). READ-ONLY here: POST the issue query over an INJECTED reqwest
# Client + endpoint + api_key (auth bootstrap deferred — never builds the key/reads the keychain).
# `default-features = false` + `rustls-tls` REUSES the in-tree rustls stack (hyper-rustls via octocrab)
# — NO native-tls/OpenSSL, no system-cert/credential auto-discovery. `json` for the request body.
# `cargo audit` runs at the P7.1 /phase-exit. The live POST is the fake-covered non-deterministic edge.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# base64 for the §6.4 Terminal Channel `data` payload (3.4): raw PTY bytes are base64-encoded so they
# ride the unchanged 4-byte-len+JSON codec (LESSON §7 — no new framing). Dep beyond the brief's list
# (which named only portable-pty) — flag at Step-9; widely-audited, `cargo audit` runs at /phase-exit.
base64 = "0.22"
# portable-pty (the brief's named dep): the daemon owns each PTY (master/slave, spawn, read/write,
# resize, waitpid exit). PTY is DISPLAY-ONLY (#9) — never scraped for status. The blocking reader runs
# on a spawn_blocking thread in the production drive loop (the write-actor-thread precedent, LESSON §9).
portable-pty = "0.9"
# NOTE (R8 merge): main's P4.0b-ui1 get_diff added a second `git2 = "0.21"` here; deduped at the
# main→edges merge — the edges `git2` entry above (default-features=false + vendored-libgit2, the
# forbidden-#6 read-only/OQ-INT-SPIKE-6 posture) is the single source. main's get_diff read_diff uses
# only core libgit2 diff APIs, satisfied by the vendored build with no default features.
# (the `nexusopsd` bin is auto-discovered from src/main.rs — no explicit [[bin]] needed.)

[features]
# §14 deterministic fault-injection (2.4) — arms checkpoints (TerminalEventWrite / BeforeTerminalTxn)
# that the gateway/eventstore consult to exercise the §17 fail-closed + crash-reconcile paths WITHOUT
# a real SIGKILL. Compiled OUT of `cargo build`/`cargo run`/release (no production fault surface); the
# self-dev-dependency below enables it ONLY for the daemon's own test/bench targets.
fault-injection = []
# P4.0b-R1a — gates daemon-internal TEST-SUPPORT items (fakes / test doubles) so they compile ONLY for
# test/bench targets, never `cargo build`/release. R1a introduces the MECHANISM only — it gates nothing
# yet (FakeHarness/FakePty/FakeLauncher stay ungated until 4.0b-2, when `PtyLauncher`'s FakeHarness
# placeholder → the real ClaudeAdapter makes them test-only). Mirrors `fault-injection` (LESSON 21);
# the cross-track edges resume gates its `integrations/` fakes behind it.
test-support = []
# P4.0b-2-smoke (brief 053) — gates the `smoke` dev-client subcommand (the 0.1-HITL "see it work" rig).
# OFF by default (production hygiene — the smoke client isn't needed in a release build); the runbook
# builds `cargo build --release --features dev-client`. NOTE (CI-rot residual, Step-9 flagged): the
# default CI does not exercise this feature → a dedicated `--features dev-client` lint/build line is a
# Future-TODO; this slice's preflight runs `clippy/build --features dev-client` to verify it.
dev-client = []

[dev-dependencies]
tempfile = "3"
# enable the daemon's own gated features for its OWN integration tests (which link the lib as a normal
# dependency, WITHOUT cfg(test)). Standard self-dev-dependency idiom: ON for test/bench targets, OFF
# for `cargo build`/release. `fault-injection` lets daemon/tests/recovery.rs arm §14 faults;
# `test-support` (R1a) gates test-only fakes (none yet — the mechanism). Both stay out of prod.
nexusopsd = { path = ".", features = ["fault-injection", "test-support"] }
# integration tests inject corrupt/future-version rows directly to exercise the
# read-path degrade/quarantine (§17) without a pub test-backdoor in the API.
rusqlite = { version = "0.34", features = ["bundled"] }
# the runtime tests drive the write-actor + accept-loop + subscribe over a tokio runtime
# (#[tokio::test]) + a real ephemeral UnixListener client. `test-util` (P4.0b-2) = `start_paused` /
# `tokio::time::pause` for the deterministic 5-min decision-wait timeout test (no real-time sleep).
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "net", "io-util", "test-util"] }
# reqwest in dev-deps too (like tokio above) so the §15 no-key-leak test can CONSTRUCT a Client +
# drive fetch_issue against a closed local port (transport-error path). Same version/features → one compile.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# git2 in the get_diff integration test (daemon/tests/get_diff.rs) — builds the fixture repo
# (Repository::init + commit + modify) the read-only read_diff is tested against (P4.0b-ui1).
git2 = "0.21"

# P2.5 — the §18 event-write/reader perf benchmark. `harness = false`: a plain `fn main()` (NOT the
# libtest harness), so it is INVISIBLE to `cargo test --workspace` (the per-slice RED/GREEN loop) and
# its timing assertions never flake there. Runs ONLY at its own cadence: `cargo bench --bench
# event_write` (the /phase-exit perf-budgets runner + 2.6's nightly CI job).
[[bench]]
name = "event_write"
harness = false

# P3.5 — the §18 terminal-attach-latency + §6.4 Terminal-Channel-throughput benchmark. `harness =
# false`: a plain `fn main()` (NOT the libtest harness), so it is INVISIBLE to `cargo test --workspace`
# (the per-slice RED/GREEN loop) and its `< 250 ms` p95 assertion never flakes there. Runs ONLY at its
# own cadence: `cargo bench --bench terminal_attach` (the /phase-exit perf-budgets runner + the nightly
# Phase-3 CI perf job). Drives the AS-BUILT 3.4 TerminalSession/PortablePtyHost host end-to-end.
[[bench]]
name = "terminal_attach"
harness = false

# P5.4 (edges-027) — the §18 project.rescan detection-latency benchmark. `harness = false`: a plain
# `fn main()` (NOT the libtest harness), so it is INVISIBLE to `cargo test --workspace` (the per-slice
# RED/GREEN loop) and its median guard never flakes there. Runs ONLY at its own cadence: `cargo bench
# --bench project_rescan` (the /phase-exit perf-budgets runner + the nightly CI perf job). Drives the
# AS-BUILT detection scan core (detect_git + detect_workflow) — the §18 `< 3 s` SLO part of the rescan.
[[bench]]
name = "project_rescan"
harness = false
