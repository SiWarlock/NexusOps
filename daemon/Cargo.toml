# nexusopsd — the Rust daemon (trust core). The single audited mutator + sole
# DB writer (§4, §15 INV-SEC-1). 1.1 lands the event-store spine.
[package]
name = "nexusopsd"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
nexusops-shared = { path = "../shared" }
# rusqlite pinned 0.34 (bundled): satisfies rusqlite_migration 2 (^0.34) while
# staying on libsqlite3-sys 0.31 — 0.40's libsqlite3-sys 0.38 uses the unstable
# `cfg_select` and won't build on stable 1.93 (see OQ-DATA-SPIKE-3).
rusqlite = { version = "0.34", features = ["bundled"] }
rusqlite_migration = "2"
ulid = "1.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2"
# RFC3339 UTC timestamps for the prod SystemClock (DATA_MODEL §2.1). Dep beyond
# the brief's list (rusqlite/migration/ulid) — flag at Step-9; justified by
# pervasive event timestamping. "parsing" added in 1.3 for outbox backoff
# arithmetic (Clock::now_plus_secs parses now + adds a Duration).
time = { version = "0.3", features = ["formatting", "parsing"] }
# getpeereid(2) FFI for the UDS peer-auth gate (§15 / safety rule #7 / ADR-004 — macOS/BSD,
# NOT the Linux-only SO_PEERCRED). The unsafe call is isolated in ipc::peer::peer_uid (1.5 L1).
libc = "0.2"
# the architecture-mandated async runtime (stack table / §12) — the daemon's first full async
# surface (1.6b): the write-actor command channel + drainer/reaper interval loops + the UDS
# accept-loop + the subscribe broadcast fanout. `net` = UnixListener; `signal` = SIGTERM/SIGINT.
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "sync", "time", "net"] }
# SHA-256 for the §6.3 idempotency-key derivation (2.3 L1): a ONE-WAY hash of the RAW action
# inputs — a fingerprint, not the secret (lead-ruled §15 Option A 2026-06-11; the keychain_ref
# convention keeps real secrets out of `inputs`, so the persisted hash reveals nothing recoverable).
# RustCrypto, audited; `cargo audit` runs at /phase-exit. Dep beyond the brief's list — flag at Step-9.
sha2 = "0.10"
# (the `nexusopsd` bin is auto-discovered from src/main.rs — no explicit [[bin]] needed.)

[features]
# §14 deterministic fault-injection (2.4) — arms checkpoints (TerminalEventWrite / BeforeTerminalTxn)
# that the gateway/eventstore consult to exercise the §17 fail-closed + crash-reconcile paths WITHOUT
# a real SIGKILL. Compiled OUT of `cargo build`/`cargo run`/release (no production fault surface); the
# self-dev-dependency below enables it ONLY for the daemon's own test/bench targets.
fault-injection = []

[dev-dependencies]
tempfile = "3"
# enable the `fault-injection` feature for the daemon's OWN integration tests (which link the lib as a
# normal dependency, WITHOUT cfg(test)). Standard self-dev-dependency idiom: ON for test targets, OFF
# for `cargo build`/release. Lets daemon/tests/recovery.rs arm §14 faults; the hook stays out of prod.
nexusopsd = { path = ".", features = ["fault-injection"] }
# integration tests inject corrupt/future-version rows directly to exercise the
# read-path degrade/quarantine (§17) without a pub test-backdoor in the API.
rusqlite = { version = "0.34", features = ["bundled"] }
# the runtime tests drive the write-actor + accept-loop + subscribe over a tokio runtime
# (#[tokio::test]) + a real ephemeral UnixListener client.
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "net", "io-util"] }
