# nexusops-ui — the Tauri 2.x desktop host (P6.8 L1 slice 2/3). Wraps the Vite frontend and
# exposes the daemon's READ methods to the frontend via a narrow typed #[tauri::command] bridge
# that calls the 049 nexusops-gateway-uds transport crate. NON-cat-1 (reads only).
[package]
name = "nexusops-ui"
version = "0.0.0"
edition = "2021"
publish = false
rust-version = "1.77.2"

[lib]
# cdylib/staticlib are required by Tauri's mobile targets; rlib lets main.rs + the integration
# test link the bridge. main.rs calls `app_lib::run()`.
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2" }

[dependencies]
tauri = { version = "2" }
# Native folder picker for the cockpit "Add project" flow (the JS calls the plugin's open({directory})).
# Scoped to `dialog:allow-open` in capabilities/default.json — no save/message surface.
tauri-plugin-dialog = { version = "2" }
nexusops-gateway-uds = { path = "../gateway-uds" }
nexusops-shared = { path = "../../shared" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
